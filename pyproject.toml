[build-system]
requires = ["hatchling>=1.25.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "wsapi-client"
dynamic = ["version"]
description = "Python SDK for WSApi: send messages, manage chats/groups, and receive events via webhooks or SSE."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WSApi" }]
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "flask>=3.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "flask>=3.0.0",
  "ruff>=0.8.0",
  "build>=1.0.0",
]
webhook = [
  "flask>=3.0.0",
]

[project.urls]
Homepage = "https://wsapi.chat"
Repository = "https://github.com/wsapi-chat/wsapi-python"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["/src/wsapi_client", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/wsapi_client"]
