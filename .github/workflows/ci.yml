name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Check lint
        run: ruff check src/ tests/

      - name: Check format
        run: ruff format --check src/ tests/

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify installed wheel
        run: |
          python -m venv /tmp/wsapi-wheel-check
          /tmp/wsapi-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wsapi-wheel-check/bin/python -c 'from wsapi_client import WSApiClient; from wsapi_client.models.events.messages import MessageEvent; from wsapi_client.models.entities.messages.ad_referral import AdReferral; assert AdReferral(ctwaClid="test").ctwa_clid == "test"'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
